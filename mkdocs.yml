site_name: Open Forest Observatory Documentation
site_url: !ENV [SITE_URL, 'https://docs.openforestobservatory.org/']
theme:
  name: material
  logo: assets/logo-shaded.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.action.edit
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      #primary: teal
      #accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      #primary: teal
      accent: lime
      
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      # Glossary links: includes/glossary-links.md is appended to every page, so
      # writing [term] anywhere links it to its glossary entry with a hover
      # preview. Matching ignores case but otherwise needs the exact text, so
      # add a line there for each variant you use (e.g. plurals).
      auto_append:
        - includes/glossary-links.md
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  # Hover previews for any manual link to the glossary
  - material.extensions.preview:
      configurations:
        - targets:
            include:
              - tutorials/glossary.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox
  - mkdocs-nav-weight:
      section_renamed: false
      index_weight: -10
      warning: true
      reverse: false
      headless_included: false
  - awesome-pages
  - pagetree
  - git-revision-date-localized:
        enable_creation_date: true
  - git-committers:
      repository: open-forest-observatory/ofo-docs
      branch: main

nav:
  - "← OFO home": https://openforestobservatory.org/
  - ...

validation:
  links:
    absolute_links: relative_to_docs

repo_url: https://github.com/open-forest-observatory/ofo-docs
repo_name: open-forest-observatory/ofo-docs
edit_uri: edit/main/docs/